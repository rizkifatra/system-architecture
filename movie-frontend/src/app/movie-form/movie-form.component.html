<div class="kopong"></div>
<div class="form-container">
  <h2>Add New Movie</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="title">Title:</label>
      <input
        type="text"
        id="title"
        [(ngModel)]="movie.title"
        name="title"
        required
      />
    </div>
    <div class="form-group">
      <label for="releaseYear">Release Year:</label>
      <input
        type="number"
        id="releaseYear"
        [(ngModel)]="movie.releaseYear"
        name="releaseYear"
        required
      />
    </div>
    <div class="form-group">
      <label for="genres">Genres:</label>
      <input type="text" id="genres" [(ngModel)]="movie.genres" name="genres" />
    </div>
    <div class="form-group">
      <label for="imdbRating">IMDB Rating:</label>
      <input
        type="number"
        id="imdbRating"
        [(ngModel)]="movie.imdbRating"
        name="imdbRating"
        step="0.1"
      />
    </div>
    <div class="form-group">
      <label for="lengthInMin">Length (minutes):</label>
      <input
        type="number"
        id="lengthInMin"
        [(ngModel)]="movie.lengthInMin"
        name="lengthInMin"
      />
    </div>
    <div class="form-group">
      <label for="poster">Poster URL:</label>
      <input type="text" id="poster" [(ngModel)]="movie.poster" name="poster" />
    </div>
    <button type="submit">Add Movie</button>
  </form>
</div>
