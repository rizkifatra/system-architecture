datastax-java-driver {
  basic {
    contact-points = ["127.0.0.1:9042"]
    load-balancing-policy.local-datacenter = "datacenter1"
  }

  advanced {
    protocol {
      version = V4
    }
    connection {
      factory {
        class = "com.datastax.oss.driver.internal.core.channel.DefaultGrpcChannelFactory"
      }
    }
  }
}
